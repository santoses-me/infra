Name: DeployInfra
SchemaVersion: 1.0
RunMode: QUEUED

Triggers:
    - Type: PUSH
      Branches:
          - dev
      FilesChanged:
          - infra/code/**

Compute:
    Type: EC2

Actions:
    TerraformInfraDeploy:
        Identifier: aws/build@v1
        Environment:
            Name: vadev
        Inputs:
            Sources:
                - WorkflowSource
        Configuration:
            Runtime:
                WorkingDirectory: infra/code
            Container:
                Registry: DockerHub
                Image: hashicorp/terraform:1.12.2
            Steps:
                - Run: terraform version
                - Run: terraform init -input=false
                - Run: terraform plan -input=false
                - Run: terraform apply -auto-approve -input=false
