Name: DeployInfra
SchemaVersion: 1.0
RunMode: QUEUED

Configuration:
    Container:
        Registry: DockerHub
        Image: hashicorp/terraform:1.12.2

Triggers:
    - Type: PUSH
      Branches:
          - dev

Compute:
    type: EC2
    platform: Linux
    size: small

Actions:
    TerraformInfraDeploy:
        Identifier: aws/build@v1
        Environment:
            Name: vadev
        Inputs:
            Sources:
                - WorkflowSource
        Configuration:
            Steps:
                - Run: terraform version
                - Run: terraform init -input=false
                - Run: terraform plan -input=false
                - Run: terraform apply -auto-approve -input=false
